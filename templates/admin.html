<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src __SUPABASE_URL__; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0e6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121116">
<title>Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="dashboard.css" integrity="__SRI_DASHBOARD_CSS__">
<script src="theme.js" integrity="__SRI_THEME_JS__"></script>
<script src="supabase.js" integrity="__SRI_SUPABASE_JS__" defer></script>
<script type="module" src="admin.js" integrity="__SRI_ADMIN_JS__"></script>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="page admin-page">
__HEADER__
<main class="card admin" id="main" data-state="checking">
<noscript><p class="notice">The admin page needs JavaScript.</p></noscript>
<div class="admin-head" data-when="signed-out not-admin check-failed ready" hidden>
  <h1 class="admin-title">Admin</h1>
  <button type="button" class="btn btn-pill" id="adminSignOut" data-when="not-admin check-failed ready" hidden>Sign out</button>
</div>
<p class="admin-line" id="adminExpired" role="status" data-when="signed-out" hidden></p>
<p class="admin-line" data-when="signed-out" hidden><a class="admin-link" href="./">Sign in on the dashboard first.</a></p>
<p class="admin-line" data-when="not-admin" hidden>This account is not an admin.</p>
<p class="notice" role="alert" data-when="check-failed" hidden>Could not check your account. Reload the page.</p>
<div data-when="ready" hidden>
  <nav class="admin-nav" aria-label="Admin">
    <a class="btn btn-pill" href="#crawl">Crawl</a>
    <a class="btn btn-pill" href="#companies">Companies</a>
    <a class="btn btn-pill" href="#alerts">Alerts</a>
    <a class="btn btn-pill" href="#log">Log</a>
  </nav>
  <section class="admin-area" id="crawl" aria-labelledby="crawlTitle" data-empty="Nothing here yet." hidden>
    <h2 id="crawlTitle" tabindex="-1">Crawl</h2>
  </section>
  <section class="admin-area" id="companies" aria-labelledby="companiesTitle" data-empty="Nothing here yet." hidden>
    <h2 id="companiesTitle" tabindex="-1">Companies</h2>
  </section>
  <section class="admin-area" id="alerts" aria-labelledby="alertsTitle" data-empty="Nothing here yet." hidden>
    <h2 id="alertsTitle" tabindex="-1">Alerts</h2>
  </section>
  <section class="admin-area" id="log" aria-labelledby="logTitle" data-empty="No changes yet." hidden>
    <h2 id="logTitle" tabindex="-1">Log</h2>
  </section>
</div>
</main>
__FOOTER__
</div>
</body>
</html>
