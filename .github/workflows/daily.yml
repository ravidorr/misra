name: daily-job-digest

# The title the Actions tab shows, and the only way the guard below tells a run started by cron-job.org from another
# manual run: the runs API returns neither the inputs nor the actor's reason, but it does return this title. Only the
# exact source "cron-job.org" is named, and a dry run never gets that title (it sends nothing, so it must not count); any other text typed into the input is never echoed into the title.
run-name: ${{ github.event_name == 'schedule' && 'daily-job-digest (scheduled)' || inputs.source == 'cron-job.org' && !inputs.digest_dry_run && 'daily-job-digest (cron-job.org)' || 'daily-job-digest (manual)' }}

on:
  schedule:
    # GitHub delays or drops scheduled runs when many workflows start at once, which happens at the top of the hour and
    # at :30 (it dropped the whole 2026-11-16 run and has started others about 7 hours late). So neither time is on
    # :00 or :30, and there are two: the first is the real one, the second is a later try that the guard job below skips
    # when a scheduled run already finished green that UTC day.
    # A third start comes from cron-job.org (see the source input below). 04:23 UTC = 06:23/07:23 Israel time (winter/summer); 09:53 UTC = 11:53/12:53 Israel time.
    - cron: "23 4 * * *"
    - cron: "53 9 * * *"
  workflow_dispatch:
    inputs:
      digest_dry_run:
        description: "Digest step only: pass --dry-run (counts in the log, nothing sent, nothing recorded)"
        type: boolean
        default: false
      allow_shrink:
        description: "Pull step only: pass --allow-shrink, to accept a history with under half of the open jobs the dashboard last published (a real loss; never for a wrong key)"
        type: boolean
        default: false
      source:
        description: "Leave empty. cron-job.org sends source=cron-job.org: the guard then skips the start if a scheduled or cron-job.org run already succeeded today"
        type: string
        required: false
        default: ""

concurrency:
  group: daily-job-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    # Decides whether a start that is only a backup has anything to do. It holds no secret, checks nothing out and
    # writes nothing: it only asks the Actions API whether a run that counts already finished green today (UTC). It runs
    # for a scheduled start and for a manual start with source=cron-job.org (the third start, from outside GitHub). Any
    # other manual run skips this job and is never skipped. If the question fails, the answer is "do not skip" (fail
    # open): a double run is harmless (the digest records what it emailed and the crawl is idempotent), a missed day is
    # not. A run counts if it ran on main and was scheduled or was started by cron-job.org (its run-name above). Other manual runs never
    # count: one may have been a dry run that sent nothing. The run job below is skipped, not failed, when this says
    # skip, so the failure alert (a step of that job) does not fire.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source == 'cron-job.org' && !inputs.digest_dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for a green scheduled or cron-job.org run today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          skip=false
          today="$(date -u +%F)"
          if count="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/runs" \
              -f status=success -f "created=>=${today}" -f per_page=100 \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and (.event == "schedule" or (.event == "workflow_dispatch" and .display_title == "daily-job-digest (cron-job.org)")))] | length')" \
              && [[ "$count" =~ ^[0-9]+$ ]]; then
            if [ "$count" -gt 0 ]; then
              skip=true
            fi
            echo "green scheduled or cron-job.org runs on ${today} (UTC): ${count}; skip=${skip}"
          else
            echo "::warning::could not read the earlier runs; running the job anyway"
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
  run:
    needs: guard
    # Runs on any other manual start always (the guard is skipped then and has no output). On a scheduled or cron-job.org
    # start it runs unless the guard said skip. !cancelled() and the "!= 'true'" test keep it running if the guard
    # failed or produced nothing (fail open).
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          # The tip of main when this job starts, not the commit the run was queued at. A run that waited in the group
          # behind a publish-docs run (or another daily run) would otherwise build on the commit from before that run's
          # push, and its own push of docs/ would conflict with it (2026-11-17: "push to main failed after 3 attempts").
          ref: main
          persist-credentials: false
      - name: Verify the deploy key before crawling or emailing
        id: verify
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to run the daily push from $GITHUB_REF; run it from main" >&2
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY secret is missing: the final push to main would be rejected by the protect-main ruleset." >&2
            exit 1
          fi
          . scripts/deploy-key.sh
          ssh-keygen -y -f "$key" > /dev/null
          git ls-remote "git@github.com:${GITHUB_REPOSITORY}.git" HEAD > /dev/null
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests playwright==1.65.0 markdown-it-py==4.0.0
      - name: Pull the history from Supabase
        id: pull
        timeout-minutes: 10
        # The history lives in Supabase (PLAN.md step 9.1); data/jobs.db is a scratch file rebuilt here on every run and
        # never committed. This step, the sync, the digests and the backup are the only ones that hold the service-role
        # key: the crawl, which runs third-party pages in a browser, never does. An empty secret, an empty `jobs` table or
        # one with under half of the jobs last published fails the step, so the crawl (and everything after it that
        # needs the history) does not run.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # "--allow-shrink" for a manual run with allow_shrink ticked (a boolean, so nothing typed reaches the shell).
          ALLOW_SHRINK_FLAG: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: python sync_supabase.py --pull $ALLOW_SHRINK_FLAG
      - run: playwright install --with-deps chromium
      - name: Crawl and diff
        id: crawl
        timeout-minutes: 20
        run: python run.py
      - name: Log the coverage gaps
        id: gaps
        timeout-minutes: 5
        # The crawl problems the maintainer no longer gets by email: one log line, a ::warning:: annotation for a new gap.
        # Its own step so a broken coverage check turns the run red (the failure alert fires) without stopping the sync.
        if: ${{ always() && steps.crawl.outcome == 'success' }}
        run: python run.py --gaps
      - name: Sync jobs to Supabase
        id: sync
        # Also after a crawl that failed part of the way: run.py commits each company as it goes, so what it recorded
        # is stored (the run is red anyway). Not when the run was cancelled (nothing is emailed or published after a cancel),
        # and not when the pull failed (the crawl is then skipped).
        if: ${{ !cancelled() && steps.pull.outcome == 'success' && steps.crawl.outcome != 'skipped' }}
        timeout-minutes: 10
        env:
          # Exposed to this step only, after the crawl. An unset secret arrives empty and fails the step.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_supabase.py
      - name: Send the subscriber digests
        id: digests
        timeout-minutes: 10
        # After the sync, so the digests and the dashboard read the same rows; only when the sync succeeded. A failure
        # here fails the run (the alert below fires) but the build and the data commit still run.
        if: ${{ always() && steps.sync.outcome == 'success' }}
        env:
          # Exposed to this step only, never to the crawl or the job. All four empty: the script skips with exit 0.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          # "--dry-run" for a manual run with digest_dry_run ticked (a boolean, so nothing typed reaches the shell).
          DRY_RUN_FLAG: ${{ inputs.digest_dry_run && '--dry-run' || '' }}
        run: python send_digests.py $DRY_RUN_FLAG
      - name: Build dashboard
        id: build
        # Only after a good sync: a failed pull or sync means the history here and Supabase may differ, and the dashboard
        # must not publish either. (A failed crawl, a failed digest or a failed gaps step still build.)
        if: ${{ always() && steps.sync.outcome == 'success' }}
        run: python build_dashboard.py
      - name: Commit the dashboard
        id: commit
        # Only after a good build, so a build that stopped half way never commits half a dashboard.
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "refusing to push from $GITHUB_REF" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in docs/index.html docs/dashboard.css docs/dashboard.js docs/auth.js docs/report.js docs/digest.js docs/email.html docs/email.js docs/supabase.js docs/theme.js docs/jobs.json docs/jobs.jsonld docs/privacy.html docs/terms.html docs/security.html docs/assistant.html docs/about.html docs/contact.html docs/contact.js docs/favicon.svg docs/apple-touch-icon.png docs/google0e1aa15dbd543e2f.html; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "daily crawl $(date -u +%F)"
          # The key is written to disk only in this step, after the crawl, and removed on exit.
          . scripts/deploy-key.sh
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "push to main failed after 3 attempts; the data is already in Supabase, the next run rebuilds docs/" >&2
          exit 1
      - name: Back up the account tables to the private backup repository
        id: backup
        # After the data commit, so a slow or failed backup never delays or blocks the deploy; and independent of the
        # crawl, so the accounts are backed up on a day the crawl failed. A failure here fails the run and triggers the
        # alert below. Everything is written outside the checkout (RUNNER_TEMP): the account data is personal and this
        # repository and its logs are public, so the log holds counts only and nothing is uploaded as an artifact.
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 10
        env:
          # Exposed to this step only (the sync and digest steps hold the first two as well). The backup key can write
          # the backup repository and nothing else.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "refusing to back up from $GITHUB_REF" >&2; exit 1; }
          if [ -z "$BACKUP_DEPLOY_KEY" ]; then
            echo "BACKUP_DEPLOY_KEY secret is missing: the account tables cannot be backed up." >&2
            exit 1
          fi
          BACKUP_WORK="$(mktemp -d "$RUNNER_TEMP/backup.XXXXXX")"
          export BACKUP_WORK
          trap 'rm -rf "$BACKUP_WORK"' EXIT
          # The key is written to disk only in this step, after the export has read the data; scripts/backup-key.sh
          # then takes over the trap and removes the key, the host keys and the work directory on exit.
          python export_accounts.py "$BACKUP_WORK/export"
          . scripts/backup-key.sh
          python publish_backup.py "$BACKUP_WORK/export" "git@github.com:ravidorr/misra-backups.git" "$BACKUP_WORK/clone"
      - name: Email an alert if the run failed
        if: ${{ (failure() || cancelled()) && steps.checkout.outcome == 'success' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS: verify=${{ steps.verify.outcome }} pull=${{ steps.pull.outcome }} crawl=${{ steps.crawl.outcome }} gaps=${{ steps.gaps.outcome }} sync=${{ steps.sync.outcome }} digests=${{ steps.digests.outcome }} build=${{ steps.build.outcome }} commit=${{ steps.commit.outcome }} backup=${{ steps.backup.outcome }}
        run: python3 send_alert.py "$RUN_URL"
