name: daily-job-digest

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC = 06:30/07:30 Israel time
  workflow_dispatch: {}

concurrency:
  group: daily-job-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false
      - name: Verify the deploy key before crawling or emailing
        id: verify
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to run the daily push from $GITHUB_REF; run it from main" >&2
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY secret is missing: the final push to main would be rejected by the protect-main ruleset." >&2
            exit 1
          fi
          . scripts/deploy-key.sh
          ssh-keygen -y -f "$key" > /dev/null
          git ls-remote "git@github.com:${GITHUB_REPOSITORY}.git" HEAD > /dev/null
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests playwright==1.65.0
      - run: playwright install --with-deps chromium
      - name: Crawl and diff
        id: crawl
        timeout-minutes: 20
        run: python run.py
      - name: Send digest
        id: digest
        timeout-minutes: 5
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python send_email.py
      - name: Build dashboard
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: python build_dashboard.py
      - name: Commit database and dashboard
        id: commit
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "refusing to push from $GITHUB_REF" >&2; exit 1; }
          python3 -c "import sqlite3,sys; r=sqlite3.connect('data/jobs.db').execute('pragma integrity_check').fetchone()[0]; sys.exit(0 if r == 'ok' else 'integrity_check: ' + r)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/jobs.db docs/index.html docs/dashboard.css docs/dashboard.js docs/theme.js docs/jobs.json docs/jobs.jsonld; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "daily crawl $(date -u +%F)"
          # The key is written to disk only in this step, after the crawl, and removed on exit.
          . scripts/deploy-key.sh
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "push to main failed after 3 attempts; the database is kept as the jobs-db artifact" >&2
          exit 1
      - name: Keep the database if the push failed
        if: ${{ failure() && steps.commit.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: jobs-db
          path: data/jobs.db
          retention-days: 7
      - name: Email an alert if the run failed
        if: ${{ (failure() || cancelled()) && steps.checkout.outcome == 'success' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS: verify=${{ steps.verify.outcome }} crawl=${{ steps.crawl.outcome }} digest=${{ steps.digest.outcome }} commit=${{ steps.commit.outcome }}
        run: python3 send_alert.py "$RUN_URL"
