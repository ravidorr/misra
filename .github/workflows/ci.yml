name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The daily pipeline pushes only data/ and docs/ using a deploy key. Unlike GITHUB_TOKEN pushes, that
    # triggers push workflows, so skip CI for those commits.
    paths-ignore:
      - data/**
      - docs/**

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: npm ci
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Install Chromium for the job-card script tests
        run: .venv/bin/playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with 100% coverage gate
        run: npm run test:coverage
      - name: Coverage report (job summary and PR comment)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: |
          {
            echo '<!-- coverage-report -->'
            echo '### Coverage'
            echo
            .venv/bin/python -m coverage report --format=markdown || echo 'No coverage data found. The tests may have failed before coverage was collected.'
          } > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$CAN_COMMENT" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body-file coverage-report.md --edit-last --create-if-none
          fi
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (dev tooling, informational)
        continue-on-error: true
        run: npm audit --audit-level=high
      # Only enforced when release-relevant files change (package.json, pyproject.toml, Python modules), see scripts/check-release.mjs.
      # Dependabot PRs never carry a release bump or changelog entry.
      - name: Version and changelog gate
        if: github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          RELEASE_TRIGGER_PATHS: pyproject.toml,adapters.py,browser_crawl.py,build_dashboard.py,classify.py,common.py,digest.py,discover.py,run.py,send_alert.py,send_email.py,survey.py,survey2.py
        run: node scripts/check-release.mjs
