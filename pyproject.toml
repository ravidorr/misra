[project]
name = "misra"
version = "0.81.0"
description = "Daily batch pipeline: crawls career pages, keeps history in SQLite, and emails a digest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "requests",
  "playwright==1.65.0",
  "markdown-it-py==4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "types-requests",
]

[tool.setuptools]
py-modules = [
  "adapters",
  "browser_crawl",
  "build_dashboard",
  "classify",
  "common",
  "descriptions",
  "discover",
  "export_accounts",
  "publish_backup",
  "regions",
  "restore_accounts",
  "run",
  "send_alert",
  "send_digests",
  "survey",
  "survey2",
  "sync_supabase",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The browser tests reuse the `site` fixture of test_dashboard_page.py, imported by name.
"tests/test_sign_in.py" = ["F811"]
"tests/test_job_choices.py" = ["F811"]
"tests/test_account_sync.py" = ["F811"]
"tests/test_admin_page.py" = ["F811"]
"tests/test_delete_account.py" = ["F811"]
"tests/test_email_page.py" = ["F811"]
"tests/test_report_site.py" = ["F811"]
"tests/test_legal_pages.py" = ["F811"]
"tests/test_digest_settings.py" = ["F811"]
"tests/test_not_found_page.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-n auto --maxprocesses=4"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*", "node_modules/*", "scripts/*"]

[tool.coverage.report]
# 100% is mandatory on push and in CI. Do not lower this.
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["adapters.py", "browser_crawl.py", "build_dashboard.py", "classify.py", "common.py", "descriptions.py", "discover.py", "export_accounts.py", "publish_backup.py", "regions.py", "restore_accounts.py", "run.py", "send_alert.py", "send_digests.py", "survey.py", "survey2.py", "sync_supabase.py"]
