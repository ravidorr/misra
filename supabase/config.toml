# Settings the Supabase CLI reads from this directory. Only the Edge Functions need any (see README.md).
project_id = "misra"

# The dashboard calls this function from the browser with no signed-in user, and a CORS preflight carries no token, so
# the platform must not demand a JWT. The function protects itself: origin check, validation, honeypot, per-visitor
# limit and a daily cap. Keeping this in the file means a redeploy cannot forget `--no-verify-jwt`.
[functions.report-site]
verify_jwt = false

# The page calls this with the signed-in user's token and the publishable key. The gateway's own JWT check is off for two
# reasons: the CORS preflight carries no Authorization header, and the function has to ask Supabase Auth who owns the
# token anyway (it needs the id, and a gateway check would not tell it). The function refuses any request without a
# token that Auth accepts.
[functions.delete-account]
verify_jwt = false

# The user presses Confirm on a static page with no sign-in, and a CORS preflight carries no token, so the platform must
# not demand a JWT. The token in the body is the credential: the function looks up the SHA-256 of it and refuses
# everything else. It acts only on a POST, never on a GET (mail scanners fetch links).
[functions.confirm-email]
verify_jwt = false

# The link in a digest email is clicked by someone who is not signed in, and a mailbox provider's RFC 8058 one-click POST
# carries no token or key either. The token in the URL is the credential and can only unsubscribe. Without this line a
# redeploy would put the gateway's JWT check back and every unsubscribe link would answer 401.
[functions.unsubscribe]
verify_jwt = false

# Turning the personalised email on or off needs a signed-in user, so here the gateway checks the access token itself
# (verify_jwt = true): a request without a valid token never reaches the function. The CORS preflight carries no token;
# the platform is expected to let OPTIONS requests through its JWT check (the live checks in supabase/README.md confirm
# it, and if they do not, set this to false: the function asks Supabase Auth who owns the token anyway and takes the
# user id only from that answer).
[functions.email-settings]
verify_jwt = true

# The assistant endpoint (MCP over HTTP): anyone's AI assistant calls it with no sign-in and no key, so the platform must
# not demand a JWT. The function protects itself: it answers 404 to everything unless the secret
# ASSISTANT_ENDPOINT_ENABLED is "true" (off until the lawyer has reviewed it), it is read-only, and it rate limits per
# caller and for everyone. Not deployed yet.
[functions.mcp]
verify_jwt = false

# The Contact page posts here from the browser with no sign-in, and a CORS preflight carries no token, so the platform must
# not demand a JWT. The function protects itself: it answers 404 to everything unless the secret CONTACT_FORM_ENABLED is
# "true" (the lawyer agreed on 2026-11-17 and 2026-11-18), then origin check, validation, honeypot, minimum fill time,
# a limit per visitor and a daily cap.
[functions.contact]
verify_jwt = false

# The admin page calls this with the signed-in maintainer's token. The gateway's JWT check is off because the CORS preflight
# carries no Authorization header; the function asks the database `public.is_admin()` with the caller's token first and
# answers 404 to everyone else, so a redeploy cannot weaken it.
[functions.admin-account]
verify_jwt = false
